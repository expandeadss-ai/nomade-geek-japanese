services:
  - type: web
    name: nomade-geek-japanese
    runtime: node
    plan: starter # SERVIÇO PAGO; confirmar preço antes da implantação
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_SITE_ORIGIN
        value: https://nomade-geek.netlify.app
    disk:
      name: jogo-japones-dados
      mountPath: /var/data
      sizeGB: 1
